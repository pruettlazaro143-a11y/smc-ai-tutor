<text x="731.9" y="720.3" font-size="19" text-anchor="end" fill="#e6eaf0" font-weight="600">第一次回到 OB</text>
<rect x="739.9" y="783.6" width="239.0" height="25.0" rx="3" fill="#0f1218" fill-opacity="0.85"/>
<text x="743.9" y="802.6" font-size="19" text-anchor="start" fill="#26a69a" font-weight="600">↑ 出现吞没反应，才考虑进</text>
<rect x="40" y="860" width="1000" height="150" rx="14" fill="#141922" stroke="#b47cff" stroke-opacity="0.6" stroke-width="2"/>
<rect x="40" y="860" width="8" height="150" rx="4" fill="#b47cff"/>
<circle cx="100" cy="908" r="24" fill="#b47cff"/>
<text x="100" y="917" font-size="26" font-weight="800" text-anchor="middle" fill="#0f1218">1</text>
<text x="140" y="918" font-size="32" font-weight="800" fill="#e6eaf0">怎么找</text>
<text x="330" y="904" font-size="24" fill="#e6eaf0">· 上涨前的最后一根阴线 = 看涨 OB</text>
<text x="330" y="944" font-size="24" fill="#e6eaf0">· 下跌前的最后一根阳线 = 看跌 OB</text>
<text x="330" y="984" font-size="24" fill="#e6eaf0">· 区域只取实体：开盘价 → 收盘价</text>
<rect x="40" y="1026" width="1000" height="150" rx="14" fill="#141922" stroke="#ff9f43" stroke-opacity="0.6" stroke-width="2"/>
<rect x="40" y="1026" width="8" height="150" rx="4" fill="#ff9f43"/>
<circle cx="100" cy="1074" r="24" fill="#ff9f43"/>
<text x="100" y="1083" font-size="26" font-weight="800" text-anchor="middle" fill="#0f1218">2</text>
<text x="140" y="1084" font-size="32" font-weight="800" fill="#e6eaf0">怎么算真</text>
<text x="330" y="1070" font-size="24" fill="#e6eaf0">· 之前扫过前高 / 前低的流动性</text>
<text x="330" y="1110" font-size="24" fill="#e6eaf0">· 之后有强力位移，一口气拉开</text>
<text x="330" y="1150" font-size="24" fill="#e6eaf0">· 并且打破了结构</text>
<rect x="40" y="1192" width="1000" height="150" rx="14" fill="#141922" stroke="#26a69a" stroke-opacity="0.6" stroke-width="2"/>
<rect x="40" y="1192" width="8" height="150" rx="4" fill="#26a69a"/>
<circle cx="100" cy="1240" r="24" fill="#26a69a"/>
<text x="100" y="1249" font-size="26" font-weight="800" text-anchor="middle" fill="#0f1218">3</text>
<text x="140" y="1250" font-size="32" font-weight="800" fill="#e6eaf0">怎么用</text>
<text x="330" y="1236" font-size="24" fill="#e6eaf0">· 回到 OB 先看反应（拒绝、吞没）再进</text>
<text x="330" y="1276" font-size="24" fill="#e6eaf0">· 第一次回测最强，测得越多越弱</text>
<text x="330" y="1316" font-size="24" fill="#e6eaf0">· 止损放在影线极端之外</text>
